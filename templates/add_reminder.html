<div class="form-card">

    <h2>
        {% if reminder %}
            Edit Reminder
        {% else %}
            New Reminder
        {% endif %}
    </h2>

    <form method="POST">

        <label>
            Title
            <input
                type="text"
                name="title"
                required
                value="{{ reminder.title if reminder else '' }}">
        </label>

        <label>
            Description
            <textarea
                name="description"
                rows="4">{{ reminder.description if reminder else '' }}</textarea>
        </label>

        <label>
            Reminder Date
            <input
                type="date"
                name="reminder_date"
                required
                value="{{ reminder.reminder_date if reminder else '' }}">
        </label>

        <label>
            Reminder Time
            <input
                type="time"
                name="reminder_time"
                required
                value="{{ reminder.reminder_time if reminder else '' }}">
        </label>

        <label>
            Repeat

            <select name="repeat">

                <option value="One Time"
                    {% if reminder and reminder.repeat=="One Time" %}selected{% endif %}>
                    One Time
                </option>

                <option value="Daily"
                    {% if reminder and reminder.repeat=="Daily" %}selected{% endif %}>
                    Daily
                </option>

                <option value="Weekly"
                    {% if reminder and reminder.repeat=="Weekly" %}selected{% endif %}>
                    Weekly
                </option>

                <option value="Monthly"
                    {% if reminder and reminder.repeat=="Monthly" %}selected{% endif %}>
                    Monthly
                </option>

                <option value="Yearly"
                    {% if reminder and reminder.repeat=="Yearly" %}selected{% endif %}>
                    Yearly
                </option>

            </select>

        </label>

        <br>

        <button type="submit" class="btn btn-primary">
            Save Reminder
        </button>

        <a href="{{ url_for('reminders') }}" class="btn">
            Cancel
        </a>

    </form>

</div>
