 <section class="section">
            <h2>{{ "Edit Crate Sale" if edit_record else "Sell Crates" }}</h2>

            <form method="post">

                {% if edit_record %}
                <input type="hidden" name="id" value="{{ edit_record.id }}">
                {% endif %}

                <label>Number of Crates
                    <input name="crates"
                           type="number"
                           min="1"
                           required
                           value="{{ edit_record.crates if edit_record else '' }}">
                </label>

                <label>Price Per Crate
                    <input name="price_per_crate"
                           type="number"
                           step="0.01"
                           required
                           value="{{ edit_record.price_per_crate if edit_record else '' }}">
                </label>

                <button class="save">
                    {{ "Update Sale" if edit_record else "Save Sale" }}
                </button>
            </form>
        </section>

        <section class="section">
            <h2>Crate Sales Records</h2>

            {% for r in rows %}
            <div class="row">

                <div>
                    <strong>{{ r.crates }} Crates</strong>
                    <small>
                        {{ r.sale_date }} |
                        {{ r.crates * 30 }} Eggs |
                        KES {{ "%.2f"|format(r.total) }}
                    </small>
                </div>

               <div class="actions">
    <a class="button edit"
       href="{{ url_for('crate_sales', edit=r.id) }}">
       Edit
    </a>

  <form
    method="POST"
    action="{{ url_for('delete_crate_sale', id=sale.id) }}"
    onsubmit="return confirm('Delete this crate sale?');"
>

    <button
        type="submit"
        class="delete-btn"
    >
        🗑️ Delete
    </button>

</form>
</div>
            </div>
            {% endfor %}
        </section>
