<section class="section">

    <div class="section-title">

        <h2>💳 Credit Sales</h2>

        <strong>
            Total Outstanding:
            KES {{ "%.2f"|format(total_credit) }}
        </strong>

    </div>

    <div class="list">

    {% for r in rows %}

        <article class="row">

            <div>

                <strong>

                    {{ r.customer }}

                </strong>

                <small>

                    {{ r.quantity }}
                    eggs

                    •

                    KES {{ "%.2f"|format(r.total) }}

                    •

                    {{ r.record_date }}

                </small>

            </div>

            <div>

                <a
                    href="{{ url_for('receive_payment', id=r.id) }}"
                    class="button save">

                    Receive Payment

                </a>

            </div>

        </article>

    {% else %}

        <p class="empty">

            No outstanding credit sales.

        </p>

    {% endfor %}

    </div>

</section>
