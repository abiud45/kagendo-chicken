 <section class="section">
            <div class="section-title">
                <h2>{{ "Edit Egg Record" if edit_record else "Add Egg Record" }}</h2>
                {% if edit_record %}<a class="button back" href="{{ url_for('eggs') }}">Cancel</a>{% endif %}
            </div>
            <form method="post">
                {% if edit_record %}<input type="hidden" name="id" value="{{ edit_record.id }}">{% endif %}
                <label>Quantity
                    <input name="quantity" type="number" min="0" required value="{{ edit_record.quantity or '' if edit_record else '' }}">
                </label>
                <label>Date
                    <input name="record_date" type="date" required value="{{ edit_record.record_date.isoformat() if edit_record else today }}">
                </label>
                <button class="save">{{ "Update Eggs" if edit_record else "Add Eggs" }}</button>
            </form>
        </section>

        <section class="section">
            <div class="section-title"><h2>Egg Records</h2></div>
            <div class="list">
                {% for r in rows %}
                <article class="row">
                    <div>
                        <strong>{{ r.quantity }} eggs</strong>
                        <small>{{ r.record_date }}</small>
                    </div>
                  <div class="actions">
    <a class="button edit"
       href="{{ url_for('eggs', edit=r.id) }}">
       Edit
    </a>

    <form method="post"
          action="{{ url_for('delete_egg', id=r.id) }}">
      <button type="submit" class="delete" onclick="return confirm('Delete this record?')">
    Del
</button>
    </form>
</div>

                </article>
                {% else %}
                <p class="empty">No egg records yet.</p>
                {% endfor %}
            </div>
        </section>
