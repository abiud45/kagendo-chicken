<section class="section">

    <div class="section-title">

        <h2>{{ "Edit Feed Record" if edit_record else "Add Feed Record" }}</h2>

        {% if edit_record %}
        <a class="button back" href="{{ url_for('feeds') }}">
            Cancel
        </a>
        {% endif %}

    </div>

    <form method="post">

        {% if edit_record %}
        <input
            type="hidden"
            name="id"
            value="{{ edit_record.id }}">
        {% endif %}

        <label>
            Feed Type

            <input
                name="feed_type"
                required
                placeholder="Layers Mash"
                value="{{ edit_record.feed_type if edit_record else '' }}">

        </label>

        <label>
            Quantity (kg)

            <input
                name="quantity"
                type="number"
                min="0"
                step="0.01"
                required
                value="{{ edit_record.quantity if edit_record else '' }}">

        </label>

        <label>
            Date

            <input
                name="record_date"
                type="date"
                required
                value="{{ edit_record.record_date if edit_record else today }}">

        </label>

        <button class="save">

            {{ "Update Feed" if edit_record else "Add Feed" }}

        </button>

    </form>

</section>


<section class="section">

    <div class="section-title">

        <h2>Feed Records</h2>

    </div>

    <div class="list">

        {% for r in rows %}

        <article class="row">

            <div>

                <strong>

                    {{ r.feed_type }}

                    -

                    {{ "%.2f"|format(r.quantity) }} kg

                </strong>

                <small>

                    {{ r.record_date }}

                </small>

            </div>

            <div class="actions">

                <a
                    class="button edit"
                    href="{{ url_for('feeds', edit=r.id) }}">

                    Edit

                </a>

                <form
                    method="post"
                    action="{{ url_for('delete_feed', id=r.id) }}">

                    <button
                        type="submit"
                        class="delete">

                        Del

                    </button>

                </form>

            </div>

        </article>

        {% else %}

        <p class="empty">

            No feed records yet.

        </p>

        {% endfor %}

    </div>

</section>
